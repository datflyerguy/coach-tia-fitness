{% extends "shared/admin_base.html" %}
{% block admin_content %}
<h1 style="font-size:24px;">Members</h1>
<div style="margin-top:20px;max-width:640px;">
  {% for m in members %}
  <div class="workout-row">
    <div><div style="font-weight:600;">{{ m['name'] }}</div><div style="font-size:12px;color:var(--muted);">{{ m['email'] }}</div></div>
    <span style="font-size:12px;color:var(--muted);">Joined {{ m['created_at'] }}</span>
  </div>
  {% endfor %}
  {% if not members %}<p style="color:var(--muted);">No members yet.</p>{% endif %}
</div>
{% endblock %}
