{% extends "shared/base.html" %}
{% block content %}
<div class="auth-shell">
  <h1 style="font-size:28px;text-align:center;">Create Your Account</h1>
  <p style="text-align:center;color:var(--muted);margin-top:8px;">One account for every program you own.</p>
  {% if error %}<div class="alert alert-error" style="margin-top:24px;">{{ error }}</div>{% endif %}
  <form method="post" style="margin-top:24px;">
    <div class="field"><label>Full Name</label><input type="text" name="name" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" minlength="8" required></div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>
  <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted);">Already have an account? <a href="{{ url_for('public.login') }}" style="text-decoration:underline;">Log in</a></p>
</div>
{% endblock %}
